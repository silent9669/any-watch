services:
  any-watch:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: any-watch-homelab:local
    restart: unless-stopped
    env_file:
      - ${ANY_WATCH_ENV_FILE:-/srv/any-watch/config/any-watch.env}
    environment:
      ANY_WATCH_DATA_DIR: /data
      ANY_WATCH_WEB_DIR: /app/web/dist
      ANY_WATCH_SECURE_COOKIES: "1"
      PORT: "3000"
    volumes:
      - ${ANY_WATCH_DATA_PATH:-/srv/any-watch/data}:/data
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - any-watch
    environment:
      ANY_WATCH_DOMAIN: ${ANY_WATCH_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
