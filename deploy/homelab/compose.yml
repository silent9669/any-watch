services:
  any-watch:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: any-watch-homelab:local
    restart: unless-stopped
    environment:
      ANY_WATCH_ADMIN_USERNAME: ${ANY_WATCH_ADMIN_USERNAME:-admin}
      ANY_WATCH_ADMIN_PASSWORD: ${ANY_WATCH_ADMIN_PASSWORD:?Set ANY_WATCH_ADMIN_PASSWORD in the Compose env file}
      ANY_WATCH_DATA_DIR: /data
      ANY_WATCH_TORRENT_DOWNLOAD_DIR: ${ANY_WATCH_TORRENT_DOWNLOAD_DIR:-/data/downloads_tmp}
      ANY_WATCH_CONFIG_PATH: ${ANY_WATCH_CONFIG_PATH:-}
      ANY_WATCH_PROVIDER_OVERRIDES: ${ANY_WATCH_PROVIDER_OVERRIDES:-}
      ANY_WATCH_INVIDIOUS_URL: ${ANY_WATCH_INVIDIOUS_URL:-}
      ANY_WATCH_INVIDIOUS_LOCAL_PROXY: ${ANY_WATCH_INVIDIOUS_LOCAL_PROXY:-1}
      ANY_WATCH_WEB_DIR: /app/web/dist
      ANY_WATCH_SECURE_COOKIES: "1"
      PORT: "3000"
    volumes:
      - ${ANY_WATCH_DATA_PATH:-/srv/any-watch/data}:/data
    networks:
      - web
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "animeheaven.me:192.99.9.229"
      - "ct.animeheaven.me:192.99.9.229"
      - "cm.animeheaven.me:192.99.9.229"
      - "ck.animeheaven.me:192.99.9.229"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      any-watch:
        condition: service_healthy
    environment:
      ANY_WATCH_DOMAIN: ${ANY_WATCH_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
