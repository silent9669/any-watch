[package]
name = "any-watch-core"
version = "1.0.9"
edition = "2021"
authors = ["silent9669 <dev@silent9669.com>"]
description = "Core provider, playback, and storage library for any-watch"
license = "MIT"
repository = "https://github.com/silent9669/any-watch"

[workspace]
members = ["server"]
resolver = "2"

[lib]
name = "any_watch_core"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Configuration directories
directories = "5.0"

# Error handling
anyhow = "1.0.103"
thiserror = "1.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
fs2 = "0.4"

# Crypto for AllAnime decryption
aes = "0.8"
aes-gcm = "0.10"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
strip = true
