name: Maintenance page

on:
  push:
    branches:
      - master
    paths:
      - "maintenance/**"
      - "scripts/validate-maintenance.mjs"
      - ".github/workflows/maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: any-watch-maintenance-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static maintenance artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run maintenance:validate

      - name: Stage Pages-only artifact
        run: |
          set -euo pipefail
          cp -R maintenance .maintenance-dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .maintenance-dist

  deploy:
    name: Deploy static maintenance artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
