name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

jobs:
  quality:
    name: Quality and server API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      - name: Validate release metadata
        run: npm run check:release-version -- "v$(node -p "require('./package.json').version")"

      - name: Build responsive web client
        run: npm run build

      - name: Validate maintenance and Cloudflare failover assets
        run: |
          npm run maintenance:validate
          npm run cloudflare:test
          bash -n deploy/homelab/bootstrap-host.sh
          bash -n deploy/homelab/cloudflare-ddns.sh

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --env-file deploy/homelab/.env.example \
            --file deploy/homelab/compose.yml \
            config --quiet

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Smoke-test hosted authentication and My List
        run: |
          cargo build -p any-watch-server
          bash scripts/smoke-web-server.sh

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('tests/e2e/requirements.txt') }}

      - name: Install browser test dependencies
        run: |
          npm ci
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run application behavior and responsive tests
        run: pytest tests/e2e/test_app.py --browser chromium -q

      - name: Run independent maintenance-page tests
        run: pytest tests/e2e/test_maintenance.py -q

  web-container:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag any-watch:provider-verification .

      - name: Smoke-test production image
        run: bash scripts/smoke-docker-providers.sh
