name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Quality and server API
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      - name: Validate release metadata
        run: npm run check:release-version -- "v$(node -p "require('./package.json').version")"

      - name: Build responsive web client
        run: npm run build

      - name: Validate maintenance and Cloudflare failover assets
        run: |
          npm run maintenance:validate
          npm run cloudflare:test
          bash -n deploy/homelab/bootstrap-host.sh
          bash -n deploy/homelab/cloudflare-ddns.sh
          docker compose \
            --env-file deploy/homelab/.env.example \
            --file deploy/homelab/compose.yml \
            config --quiet

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Smoke-test hosted authentication and My List
        run: |
          cargo build -p ani-desk-server
          scripts/smoke-web-server.sh

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/requirements.txt') }}
      - name: Install browser test dependencies
        run: |
          npm ci
          python -m pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run application behavior and responsive tests
        run: pytest tests/e2e/test_app.py -q
      - name: Run independent maintenance-page tests
        run: pytest tests/e2e/test_maintenance.py -q

  web-container:
    name: Production container and providers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag any-watch:provider-verification .
      - name: Verify authenticated providers and opaque media proxy
        run: npm run providers:test:docker

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Frontend audit
        run: npm audit --audit-level=high
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Rust audit
        run: cargo audit
